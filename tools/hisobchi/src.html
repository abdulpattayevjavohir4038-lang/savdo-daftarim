function rangeOf(per, anchor) {
  const t = todayK();
  if (per === 'today') return { a: t, b: addK(t, 1), lbl: 'Bugun, ' + dShort(t) };
  if (per === 'yest') { const y = addK(t, -1); return { a: y, b: t, lbl: 'Kecha, ' + dShort(y) }; }
  if (per === 'day') return { a: anchor, b: addK(anchor, 1), lbl: dLabel(anchor) };
  if (per === 'week') { const w = weekStart(anchor); return { a: w, b: addK(w, 7), lbl: dShort(w) + ' — ' + dShort(addK(w, 6)) }; }
  if (per === 'month') { const m = mStart(anchor); return { a: m, b: addM(m, 1), lbl: mLabel(m) }; }
  if (per === 'year') { const y = anchor.slice(0, 4) + '-01-01'; return { a: y, b: (+anchor.slice(0, 4) + 1) + '-01-01', lbl: anchor.slice(0, 4) + '-yil' }; }
  return { a: '2000-01-01', b: addK(t, 1), lbl: 'Hammasi' };
}
function shift(per, anchor, n) {
  if (per === 'day' || per === 'today' || per === 'yest') return addK(anchor, n);
  if (per === 'week') return addK(anchor, 7 * n);
  if (per === 'month') return addM(anchor, n);
  if (per === 'year') return (+anchor.slice(0, 4) + n) + anchor.slice(4);
  return anchor;
}
const inR = (ts, r) => ts >= dayStart(r.a) && ts < dayStart(r.b);
// davr yig'indisi ko'rinish valyutasida (v — majburiy ko'rinish, masalan byudjet uchun 'UZS')
function sums(r, v) {
  let inn = 0, out = 0, n = 0, qIn = 0, qOut = 0; const byO = {}, byI = {};
  for (const x of S.data.tx) {
    if (!inR(x.ts, r)) continue;
    const a = vv(x.amount, x.cur, v); if (a == null) continue;
    if (x.cat === 'qarz') { if (x.kind === 'in') qIn += a; else qOut += a; continue; }
    n++;
    if (x.kind === 'in') { inn += a; byI[x.cat] = (byI[x.cat] || 0) + a; } else { out += a; byO[x.cat] = (byO[x.cat] || 0) + a; }
  }
  return { inn, out, n, byO, byI, qIn, qOut };
}
function debtTotals() {

}

    '<span class="grow"><span class="row between" style="gap:.5rem"><span class="fw6 trunc">' + esc(d.name) + '</span><span class="amt ' + (d.closed ? 'faint' : me ? 'c-warn' : 'c-neg') + '">' + mny(d.closed ? d.amount : left, d.cur) + '</span></span>' +

function vDebt() {

/* ---------- Hisobotlar ---------- */
function chart(r, per) {
  const cols = [];
  if (per === 'year') for (let m = 0; m < 12; m++) { const a = r.a.slice(0, 5) + String(m + 1).padStart(2, '0') + '-01'; cols.push({ a: a, b: addM(a, 1), l: MONTHS[m].slice(0, 3), t: mLabel(a) }); }
  else { let k = r.a; while (k < r.b) { cols.push({ a: k, b: addK(k, 1), l: per === 'week' ? WD[kd(k).getUTCDay()].slice(0, 2) : String(+k.slice(8)), t: dShort(k) }); k = addK(k, 1); } }
  for (const c of cols) { c.i = 0; c.o = 0; }
  for (const x of S.data.tx) { if (x.cat === 'qarz') continue; const a = vv(x.amount, x.cur); if (a == null) continue; for (const c of cols) if (x.ts >= dayStart(c.a) && x.ts < dayStart(c.b)) { if (x.kind === 'in') c.i += a; else c.o += a; break; } }
  const max = Math.max(1, ...cols.map((c) => Math.max(c.i, c.o)));
  const step = cols.length > 16 ? 5 : 1;
  return '<div class="chart-wrap"><div class="bars">' + cols.map((c) => '<div class="b" data-t="' + esc(c.t + '\n+' + vf(c.i) + '\n−' + vf(c.o)) + '"><i style="height:' + (c.i / max * 100) + '%;background:rgb(var(--pos))"></i><i style="height:' + (c.o / max * 100) + '%;background:rgb(var(--neg))"></i></div>').join('') + '</div>' +
    '<div class="bars-x">' + cols.map((c, i) => '<span>' + (i % step === 0 || i === cols.length - 1 ? c.l : '') + '</span>').join('') + '</div>' +
    '<div class="lg"><span><i style="background:rgb(var(--pos))"></i>Kirim</span><span><i style="background:rgb(var(--neg))"></i>Chiqim</span></div></div>';
}
function budgetRows(r) {
  const b = S.data.user.budgets || {}, ids = Object.keys(b).filter((k) => +b[k] > 0);
  if (!ids.length) return '<div class="empty">Byudjet qoʻyilmagan. Toifaga oylik limit qoʻysangiz, oshib ketishidan oldin ogohlantiraman.</div>';
  const m = rangeOf('month', todayK()), s = sums(m, 'UZS'), t = todayK(), dom = +t.slice(8, 10), D = dim(t);
  return ids.map((id) => { const c = catOf(id), lim = +b[id], sp = s.byO[id] || 0, p = Math.round(sp * 100 / lim), fc = sp / dom * D;
    const tone = p >= 100 ? 'neg' : fc > lim ? 'warn' : 'pos';
    return '<button class="li" data-budget="' + id + '" style="flex-wrap:wrap"><span class="emo" style="width:34px;height:34px;font-size:1.05rem">' + c.e + '</span><span class="grow"><span class="row between"><span class="fw6">' + esc(c.n) + '</span><span class="amt fs14">' + fmt(sp) + ' / ' + fmt(lim) + '</span></span>' +
      '<span class="prog" style="display:block;margin-top:6px"><i style="width:' + Math.min(100, Math.max(2, p)) + '%;background:rgb(var(--' + tone + '))"></i></span>' +
      '<span class="fs12 c-' + tone + '" style="display:block;margin-top:4px">' + (p >= 100 ? 'Limitdan oshdi: +' + fmt(sp - lim) : fc > lim ? 'Shu tezlikda oy oxirida ~' + sh(fc) + ' boʻladi' : 'Qoldi: ' + fmt(lim - sp)) + '</span></span></button>'; }).join('');
}
function vRep() {
  const r = rangeOf(S.rPer, S.rAnchor), s = sums(r), net = s.inn - s.out, t = todayK();
  const days = Math.max(1, Math.round((Math.min(dayStart(r.b), dayStart(addK(t, 1))) - dayStart(r.a)) / 864e5));
  const avg = s.out / days;
  const curM = S.rPer === 'month' && mStart(S.rAnchor) === mStart(t), fc = curM ? s.out / +t.slice(8, 10) * dim(t) : 0;
  return '<div class="card p4" style="display:flex;flex-direction:column;gap:.75rem">' + curBar() + perChips('rper', S.rPer, [['week', 'Hafta'], ['month', 'Oy'], ['year', 'Yil']]) +
      '<div class="pnav"><button class="btn btn-ghost btn-icon btn-sm" data-rshift="-1" aria-label="Oldingi">' + ic('left', 18) + '</button><div class="lbl">' + r.lbl + '</div><button class="btn btn-ghost btn-icon btn-sm" data-rshift="1" ' + (r.b <= t ? '' : 'disabled') + ' aria-label="Keyingi">' + ic('right', 18) + '</button></div></div>' +
    '<div class="grid2 k3">' + kpi('down', 'pos', 'Kirim', vf(s.inn), '') + kpi('up', 'neg', 'Chiqim', vf(s.out), 'kuniga oʻrtacha ' + (view() === 'USD' ? usd(avg) : sh(avg))) +
      kpi('trend', net >= 0 ? 'pos' : 'neg', 'Farq', (net > 0 ? '+' : '') + vf(net), s.inn ? 'kirimning ' + Math.round(Math.abs(net) * 100 / s.inn) + '% ' + (net >= 0 ? 'tejaldi' : 'ortiqcha sarflandi') : 'kirim − chiqim') +
      (curM ? kpi('calendar', 'warn', 'Oy oxiriga prognoz', vf(fc), 'shu tezlikda chiqim') : '') +
      '</div>' +
    '<div class="card"><div class="sect"><div class="sect-t">Kirim va chiqim</div><span class="fs13 faint">' + r.lbl + '</span></div>' + chart(r, S.rPer) + '</div>' +
    '<div class="two-col" style="display:grid;gap:1rem">' +
      '<div class="card"><div class="sect"><div class="sect-t">Chiqim — toifalar</div><span class="amt c-neg">' + vf(s.out) + '</span></div>' + catBars(s.byO, s.out) + '</div>' +
      '<div style="display:flex;flex-direction:column;gap:1rem"><div class="card"><div class="sect"><div class="sect-t">Kirim — manbalar</div><span class="amt c-pos">' + vf(s.inn) + '</span></div>' + catBars(s.byI, s.inn) + '</div>' +
      '<div class="card"><div class="sect"><div class="sect-t">Byudjet (shu oy' + (hasUsd() ? ', soʻmda' : '') + ')</div><button class="btn btn-text btn-sm" data-budget="">' + ic('plus', 16) + 'Qoʻshish</button></div>' + budgetRows(r) + '</div></div>' +
    '</div>' +
    '<div class="hint" style="text-align:center">Qarz berish/olish va qaytarishlar kirim-chiqim hisobotiga kirmaydi, lekin balansga taʼsir qiladi.</div>';
}

/* ---------- hodisalar ---------- */
function bindView() {
  applyThemeGroups();
  const q = $('#quick');
  if (q) q.onsubmit = async (e) => { e.preventDefault(); const inp = $('#q-in'); const v = inp.value.trim(); if (!v) { inp.focus(); return; }
    const r = await mut('quick', { text: v }); if (r) { inp.value = ''; const c = catOf(r.cat); toast((r.kind === 'in' ? 'Kirim: +' : 'Chiqim: −') + mny(r.amount, r.cur) + ' · ' + c.e + ' ' + c.n + (r.x1000 ? ' (' + fmt(r.amount / 1000) + ' → ' + fmt(r.amount) + ')' : '')); } };
  const tq = $('#tx-q');
  if (tq) tq.oninput = () => { S.txQ = tq.value; const pos = tq.selectionStart; render(); const n = $('#tx-q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } };
  const sw = $('#sw-daily');
  if (sw) sw.onchange = () => mut('daily', { on: sw.checked }, sw.checked ? 'Kechki hisobot yoqildi' : 'Kechki hisobot oʻchirildi');
}
function applyThemeGroups() { const t = getTheme(); $$('[data-theme-group]').forEach((g) => { const lbl = !g.closest('#sidebar'); g.innerHTML = [['light', 'sun', 'Yorugʻ'], ['dark', 'moon', 'Qorongʻi'], ['system', 'monitor', 'Tizim']].map(([v, i, l]) => '<button data-theme="' + v + '" aria-pressed="' + (t === v) + '" title="' + l + '">' + ic(i, 16) + (lbl ? '<span>' + l + '</span>' : '') + '</button>').join(''); }); }
document.addEventListener('click', async (e) => {
  const el = e.target.closest('button,[data-export],[data-balance]'); if (!el || el.closest('#modal')) return;
  const ds = el.dataset;
  if (ds.view) { S.view = ds.view; try { localStorage.setItem('hisobchi_view', ds.view); } catch (er) { /* ignore */ } render(); }
  else if (ds.per) { S.per = ds.per; S.anchor = todayK(); render(); }
  else if (ds.pshift) { if (S.per === 'today' || S.per === 'yest') S.per = 'day'; S.anchor = shift(S.per, S.anchor, +ds.pshift); render(); }
  else if (ds.txper) { S.txPer = ds.txper; S.txAnchor = todayK(); render(); }
  else if (ds.txshift) { S.txAnchor = shift(S.txPer, S.txAnchor, +ds.txshift); render(); }
  else if (ds.txf) { S.txF = ds.txf; render(); }
  else if (ds.rper) { S.rPer = ds.rper; S.rAnchor = todayK(); render(); }
  else if (ds.rshift) { S.rAnchor = shift(S.rPer, S.rAnchor, +ds.rshift); render(); }
  else if (ds.df) { S.dF = ds.df; render(); }
  else if (ds.new) txForm(null, ds.new);
  else if (ds.newdebt) debtForm(ds.newdebt);
  else if (ds.tx) { const x = S.data.tx.find((y) => y.id === +ds.tx); if (!x) return; if (x.cat === 'qarz' && x.debt) debtView(x.debt); else txForm(x); }
  else if (ds.debt) debtView(+ds.debt);
  else if (ds.budget !== undefined) budgetForm(ds.budget);
  else if ('balance' in ds) balanceForm();
  else if ('export' in ds) exportCsv();
  else if ('bot' in ds) { if (S.data.bot) openTg('https://t.me/' + S.data.bot + '?start=hamyon'); else botLink(); }
  else if ('video' in ds) videoModal();
  else if ('apps' in ds) location.href = '../ilovalar/' + (location.hash || '');
  else if ('logout' in ds) { if (await confirmBox('Chiqish', 'Shu qurilmadan chiqasizmi? Maʼlumotlar oʻchmaydi — keyin Telegram orqali qayta kirasiz.', 'Chiqish', true)) logout(); }
});
async function botLink() { try { const r = await api('login_start'); if (r.bot) { S.data.bot = r.bot; openTg('https://t.me/' + r.bot + '?start=hamyon'); } } catch (e) { toast(errText(e), true); } }

/* ---------- oynalar: kirim/chiqim ---------- */
function catGrid(kind, cur) {
  return '<div class="catg">' + cats().filter((c) => c.kind === kind).map((c) => '<button type="button" class="catb" data-cat="' + c.id + '" aria-pressed="' + (c.id === cur) + '"><span>' + c.e + '</span><span>' + esc(c.n) + '</span></button>').join('') + '</div>';
}
function txForm(x, kind0) {
  const edit = !!x; let kind = x ? x.kind : kind0 || 'out', cat = x ? x.cat : '', cur = x ? x.cur || 'UZS' : lastCur();
  const dateV = x ? keyOf(x.ts) : todayK();
  const ov = modal(edit ? 'Yozuvni tahrirlash' : (kind === 'in' ? 'Yangi kirim' : 'Yangi chiqim'),
    '<div class="seg full" role="group"><button type="button" class="s-out" data-k="out">' + ic('up', 16) + 'Chiqim</button><button type="button" class="s-in" data-k="in">' + ic('down', 16) + 'Kirim</button></div>' +
    '<div><div class="lrow"><label class="label" for="f-amt">Summa</label>' + curSeg('f-cur', cur) + '</div><input id="f-amt" class="input big-in num" inputmode="decimal" autocomplete="off" placeholder="0" value="' + (x ? inVal(x.amount, cur) : '') + '"></div>' +
    '<div><label class="label" for="f-note">Izoh</label><input id="f-note" class="input" maxlength="80" autocomplete="off" placeholder="masalan: tushlik, taksi, oylik" value="' + esc(x ? x.note : '') + '"></div>' +
    '<div><div class="label">Toifa <span class="faint fw6" id="f-auto"></span></div><div id="f-cats"></div></div>' +
    '<div><label class="label" for="f-date">Sana</label><input id="f-date" type="date" class="input" max="' + todayK() + '" value="' + dateV + '"></div>',
    (edit ? '<button class="btn btn-dghost btn-icon" data-del aria-label="Oʻchirish" title="Oʻchirish">' + ic('trash') + '</button>' : '<button class="btn btn-ghost" data-close>Bekor qilish</button>') +
    '<button class="btn btn-primary" data-save>' + ic('check', 18) + 'Saqlash</button>', { focus: '#f-amt' });
  const paint = () => {
    $$('[data-k]', ov).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === kind)));
    $('#f-cats', ov).innerHTML = catGrid(kind, cat);
    $('#f-auto', ov).textContent = cat ? '' : '(tanlanmasa — izohdan oʻzi aniqlanadi)';
    if (!edit) $('.sheet-h .grow', ov).textContent = kind === 'in' ? 'Yangi kirim' : 'Yangi chiqim';
  };
  paint(); bindMoney($('#f-amt', ov), () => cur);
  ov.addEventListener('click', async (e) => {
    const cb = e.target.closest('[data-cur]'); if (cb) { cur = cb.dataset.cur; $$('#f-cur [data-cur]', ov).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cur === cur))); const a = $('#f-amt', ov); a.value = fmtIn(a.value, cur); a.focus(); return; }
    const k = e.target.closest('[data-k]'); if (k) { if (kind !== k.dataset.k) { kind = k.dataset.k; cat = ''; paint(); } return; }
    const c = e.target.closest('[data-cat]'); if (c) { cat = cat === c.dataset.cat ? '' : c.dataset.cat; paint(); return; }
    if (e.target.closest('[data-save]')) {
      const amount = money($('#f-amt', ov), cur); if (!amount) { toast('Summani kiriting', true); $('#f-amt', ov).focus(); return; }
      const body = { kind: kind, amount: amount, cur: cur, cat: cat, note: $('#f-note', ov).value, date: $('#f-date', ov).value };
      if (edit && !cat) body.cat = kind === x.kind ? x.cat : '';
      const r = edit ? await mut('tx_edit', Object.assign({ id: x.id }, body), 'Saqlandi') : await mut('tx_add', body);
      if (r) { closeModal(); setLastCur(cur); if (!edit) { const cc = catOf(r.cat); toast((kind === 'in' ? 'Kirim: +' : 'Chiqim: −') + mny(amount, cur) + ' · ' + cc.e + ' ' + cc.n); } }
      return;
    }
    if (e.target.closest('[data-del]')) { closeModal(); if (await confirmBox('Oʻchirish', '<b>' + (x.kind === 'in' ? '+' : '−') + mny(x.amount, x.cur) + unitOf(x.cur) + '</b> · ' + esc(x.note || catOf(x.cat).n) + ' — oʻchirilsinmi?', 'Oʻchirish', true)) await mut('tx_del', { id: x.id }, 'Oʻchirildi'); }
  });
  $('#f-amt', ov).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#f-note', ov).focus(); });
  $('#f-note', ov).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('[data-save]', ov).click(); });
}

/* ---------- oynalar: qarz ---------- */
function debtForm(dir) {
  const names = Array.from(new Set(S.data.debts.map((d) => d.name))).slice(0, 50); let cur = lastCur();
  const ov = modal(dir === 'me' ? 'Qarz berdim' : 'Qarz oldim',
    '<div class="seg full" role="group"><button type="button" data-dir="me">' + ic('give', 16) + 'Qarz berdim</button><button type="button" data-dir="i">' + ic('take', 16) + 'Qarz oldim</button></div>' +
    '<div><label class="label" for="d-name" id="d-name-l">Kimga?</label><input id="d-name" class="input" maxlength="40" list="d-names" autocomplete="off" placeholder="Ism"><datalist id="d-names">' + names.map((n) => '<option value="' + esc(n) + '">').join('') + '</datalist></div>' +
    '<div><div class="lrow"><label class="label" for="d-amt">Summa</label>' + curSeg('d-cur', cur) + '</div><input id="d-amt" class="input big-in num" inputmode="decimal" autocomplete="off" placeholder="0"></div>' +
    '<div><label class="label" for="d-note">Izoh (ixtiyoriy)</label><input id="d-note" class="input" maxlength="80" autocomplete="off" placeholder="masalan: qaytarish muddati — 1-dekabr"></div>' +
    '<div><label class="label" for="d-date">Sana</label><input id="d-date" type="date" class="input" max="' + todayK() + '" value="' + todayK() + '"></div>' +
    '<label class="row" style="gap:.625rem;align-items:flex-start;cursor:pointer"><input type="checkbox" class="switch" id="d-flow" checked><span class="fs14"><b id="d-flow-t"></b><span class="faint" style="display:block;margin-top:2px">Oʻchirsangiz — eski qarz deb yoziladi, balansga taʼsir qilmaydi.</span></span></label>',
    '<button class="btn btn-ghost" data-close>Bekor qilish</button><button class="btn btn-primary" data-save>' + ic('check', 18) + 'Saqlash</button>', { focus: '#d-name' });
  const paint = () => {
    $$('[data-dir]', ov).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.dir === dir)));
    $('.sheet-h .grow', ov).textContent = dir === 'me' ? 'Qarz berdim' : 'Qarz oldim';
    $('#d-name-l', ov).textContent = dir === 'me' ? 'Kimga berdingiz?' : 'Kimdan oldingiz?';
    $('#d-flow-t', ov).textContent = dir === 'me' ? 'Pul hozir berildi — balansdan ayirilsin' : 'Pul hozir olindi — balansga qoʻshilsin';
  };
  paint(); bindMoney($('#d-amt', ov), () => cur);
  ov.addEventListener('click', async (e) => {
    const cb = e.target.closest('[data-cur]'); if (cb) { cur = cb.dataset.cur; $$('#d-cur [data-cur]', ov).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.cur === cur))); const a = $('#d-amt', ov); a.value = fmtIn(a.value, cur); a.focus(); return; }
    const d = e.target.closest('[data-dir]'); if (d) { dir = d.dataset.dir; paint(); return; }
    if (e.target.closest('[data-save]')) {
      const name = $('#d-name', ov).value.trim(), amount = money($('#d-amt', ov), cur);
      if (!name) { toast('Ismni yozing', true); $('#d-name', ov).focus(); return; }
      if (!amount) { toast('Summani kiriting', true); $('#d-amt', ov).focus(); return; }
      const r = await mut('debt_add', { dir: dir, name: name, amount: amount, cur: cur, note: $('#d-note', ov).value, date: $('#d-date', ov).value, flow: $('#d-flow', ov).checked }, 'Qarz daftariga yozildi');
      if (r) { closeModal(); setLastCur(cur); if (S.tab !== 'debt' && S.tab !== 'home') go('debt'); }
    }
  });
}
function debtView(id) {
  const d = S.data.debts.find((x) => x.id === id); if (!d) { toast('Qarz topilmadi', true); return; }
  const me = d.dir === 'me', left = d.amount - d.paid, p = Math.round(d.paid * 100 / d.amount);
  const hist = S.data.tx.filter((x) => x.debt === id).sort((a, b) => a.ts - b.ts);
  const ov = modal(esc(d.name),
    '<div class="row"><span class="ico ' + (me ? 't-warn' : 't-neg') + '" style="width:44px;height:44px;border-radius:12px">' + ic(me ? 'give' : 'take', 22) + '</span><div class="grow"><div class="fw7">' + (me ? 'Menga qarz (men berganman)' : 'Men qarzdorman (men olganman)') + '</div><div class="fs13 faint">' + dmy(d.at) + (d.closed ? ' · ✅ yopilgan' + (d.closedAt ? ' ' + dmy(d.closedAt) : '') : '') + '</div></div></div>' +
    '<div class="grid2" style="grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem">' +
      '<div class="card" style="padding:.625rem .75rem"><div class="fs12 faint fw6">Jami</div><div class="amt">' + mny(d.amount, d.cur) + '</div></div>' +
      '<div class="card" style="padding:.625rem .75rem"><div class="fs12 faint fw6">' + (me ? 'Qaytardi' : 'Toʻladim') + '</div><div class="amt c-pos">' + mny(d.paid, d.cur) + '</div></div>' +
      '<div class="card" style="padding:.625rem .75rem"><div class="fs12 faint fw6">Qoldi</div><div class="amt ' + (left ? (me ? 'c-warn' : 'c-neg') : 'c-pos') + '">' + mny(left, d.cur) + '</div></div></div>' +
    '<div class="prog"><i style="width:' + Math.max(2, p) + '%;background:rgb(var(--pos))"></i></div>' +
    (d.note ? '<div class="fs14 muted">📝 ' + esc(d.note) + '</div>' : '') +
    (d.split ? '<div class="fs13 faint">Hisobni boʻlishdan yozilgan qarz</div>' : '') +
    (!d.flow && !d.paid ? '<div class="fs13 faint">Eski qarz — berilgan/olingan pul balansga taʼsir qilmagan.</div>' : '') +
    (hist.length ? '<div><div class="label">Harakatlar</div><div class="card" style="overflow:hidden">' + hist.map((x) => '<div class="li" style="padding:.5rem .75rem"><span class="grow fs14">' + esc(x.note) + '<span class="faint fs12" style="display:block">' + dmy(x.ts) + ' ' + hhmm(x.ts) + '</span></span><span class="amt fs14 ' + (x.kind === 'in' ? 'c-pos' : 'c-neg') + '">' + (x.kind === 'in' ? '+' : '−') + mny(x.amount, x.cur) + '</span></div>').join('') + '</div></div>' : '') +
    (!d.closed ? '<div id="pay-box" class="card p4" style="display:flex;flex-direction:column;gap:.5rem"><label class="label" for="p-amt" style="margin:0">' + (me ? 'Qancha qaytardi?' : 'Qancha toʻladingiz?') + (d.cur === 'USD' ? ' ($)' : '') + '</label><div class="qin"><input id="p-amt" class="input num" inputmode="decimal" autocomplete="off" placeholder="' + inVal(left, d.cur) + '"><button class="btn btn-primary" data-pay>' + (me ? 'Qabul qilish' : 'Toʻladim') + '</button></div></div>' : ''),
    '<button class="btn btn-dghost btn-icon" data-ddel aria-label="Oʻchirish" title="Oʻchirish">' + ic('trash') + '</button>' +
    (d.flow && !d.paid ? '<button class="btn btn-ghost" data-noflow title="Balansga taʼsir qilmasin">Eski qarz</button>' : '') +
    (!d.closed ? '<button class="btn btn-primary" data-close-debt>' + ic('check', 18) + 'Toʻliq yopish</button>' : '<button class="btn btn-ghost" data-close>Yopish</button>'));
  const pa = $('#p-amt', ov); if (pa) bindMoney(pa, () => d.cur);
  ov.addEventListener('click', async (e) => {
    if (e.target.closest('[data-pay]')) { const v = money(pa, d.cur); if (!v) { toast('Summani kiriting', true); pa.focus(); return; }
      const r = await mut('debt_pay', { id: id, amount: v }); if (r) { toast(mny(r.v, d.cur) + unitOf(d.cur) + ' yozildi' + (r.closed ? ' — qarz yopildi ✅' : '')); debtView(id); } return; }
    if (e.target.closest('[data-close-debt]')) { const r = await mut('debt_pay', { id: id }); if (r) { toast('Qarz toʻliq yopildi ✅'); debtView(id); } return; }
    if (e.target.closest('[data-noflow]')) { const r = await mut('debt_noflow', { id: id }, 'Balansga taʼsir qilmaydigan qilindi'); if (r) debtView(id); return; }
    if (e.target.closest('[data-ddel]')) { closeModal(); if (await confirmBox('Qarzni oʻchirish', '<b>' + esc(d.name) + '</b> — ' + mny(d.amount, d.cur) + unitOf(d.cur) + '. Unga bogʻliq toʻlovlar ham oʻchadi.', 'Oʻchirish', true)) await mut('debt_del', { id: id }, 'Oʻchirildi'); }
  });
}

/* ---------- oynalar: balans, byudjet ---------- */
function balanceForm() {
  const u = S.data.user;
  const ov = modal('Balans', '<p class="fs14 muted" style="line-height:1.5">Hozir qoʻlingizda (karta + naqd) qancha pul bor? Bundan keyingi har bir kirim, chiqim va qarz harakati balansga oʻzi qoʻshiladi yoki ayiriladi.</p>' +
    '<div><label class="label" for="b-amt">Balans (soʻm)</label><input id="b-amt" class="input big-in num" inputmode="numeric" autocomplete="off" placeholder="0" value="' + (u.balanceNow != null ? fmt(Math.max(0, u.balanceNow)) : '') + '"></div>',
    (u.balance != null ? '<button class="btn btn-dghost" data-bclear>Kuzatmaslik</button>' : '<button class="btn btn-ghost" data-close>Bekor qilish</button>') + '<button class="btn btn-primary" data-bsave>' + ic('check', 18) + 'Saqlash</button>', { focus: '#b-amt' });
  bindMoney($('#b-amt', ov));
  ov.addEventListener('click', async (e) => {
    if (e.target.closest('[data-bsave]')) { const r = await mut('balance', { value: money($('#b-amt', ov)) }, 'Balans saqlandi'); if (r) closeModal(); }
    if (e.target.closest('[data-bclear]')) { const r = await mut('balance', { value: null }, 'Balans kuzatilmaydi'); if (r) closeModal(); }
  });
}
function budgetForm(cat) {
  const b = S.data.user.budgets || {};
  let cur = cat || '';
  const ov = modal('Byudjet — oylik limit', '<div><div class="label">Toifa</div><div id="g-cats"></div></div>' +
    '<div><label class="label" for="g-amt">Oylik limit (soʻm)</label><input id="g-amt" class="input big-in num" inputmode="numeric" autocomplete="off" placeholder="0"></div>' +
    '<div class="hint" style="margin:0">0 yoki boʻsh — limitni olib tashlash.</div>',
    '<button class="btn btn-ghost" data-close>Bekor qilish</button><button class="btn btn-primary" data-gsave>' + ic('check', 18) + 'Saqlash</button>');
  const paint = () => { $('#g-cats', ov).innerHTML = catGrid('out', cur); $('#g-amt', ov).value = cur && b[cur] ? fmt(b[cur]) : ''; };
  paint(); bindMoney($('#g-amt', ov));
  ov.addEventListener('click', async (e) => {
    const c = e.target.closest('[data-cat]'); if (c) { cur = c.dataset.cat; paint(); $('#g-amt', ov).focus(); return; }
    if (e.target.closest('[data-gsave]')) { if (!cur) { toast('Toifani tanlang', true); return; } const v = money($('#g-amt', ov)); const r = await mut('budget', { cat: cur, value: v }, v ? 'Limit saqlandi' : 'Limit olib tashlandi'); if (r) closeModal(); }
  });
}

/* ---------- video darslik ---------- */
const VIDEO = 'hisobchi.mp4', VIDEO_BASE = 'https://cdn.jsdelivr.net/gh/abdulpattayevjavohir4038-lang/savdo-daftarim@main/docs/video/', VIDEO_ALT = 'https://raw.githubusercontent.com/abdulpattayevjavohir4038-lang/savdo-daftarim/main/docs/video/';
function videoModal() {
  const ov = modal('Video darslik', '<video id="vd" controls playsinline preload="metadata" style="width:100%;max-height:68dvh;aspect-ratio:9/16;border-radius:14px;background:#000" src="' + VIDEO_BASE + VIDEO + '"></video>' +
    '<p class="hint" style="margin:0">Internet kerak. Ochilmasa — <a class="c-pri fw6" target="_blank" rel="noopener" href="' + VIDEO_ALT + VIDEO + '">faylni yuklab oling</a>.</p>');
  const v = $('#vd', ov); let alt = false; v.onerror = () => { if (!alt) { alt = true; v.src = VIDEO_ALT + VIDEO; } };
  ov.addEventListener('click', (e) => { if (e.target === ov || e.target.closest('[data-close]')) try { v.pause(); } catch (er) { /* ignore */ } });
}

/* ---------- CSV ---------- */
function exportCsv() {
  const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const n = (v) => String(Math.round(v * 100) / 100).replace('.', ','), cu = (c) => (c === 'USD' ? 'USD' : 'soʻm');
  const L = [['Sana', 'Vaqt', 'Turi', 'Toifa', 'Izoh', 'Summa', 'Valyuta'].map(q).join(';')];
  S.data.tx.slice().sort((a, b) => a.ts - b.ts).forEach((x) => L.push([dmy(x.ts), hhmm(x.ts), x.kind === 'in' ? 'Kirim' : 'Chiqim', catOf(x.cat).n, x.note, (x.kind === 'in' ? '' : '-') + n(x.amount), cu(x.cur)].map(q).join(';')));
  L.push('', [q('Qarzlar')].join(';'), ['Sana', 'Kim', 'Turi', 'Jami', 'Toʻlangan', 'Qoldi', 'Valyuta', 'Holat', 'Izoh'].map(q).join(';'));
  S.data.debts.forEach((d) => L.push([dmy(d.at), d.name, d.dir === 'me' ? 'Menga qarz' : 'Men qarzdorman', n(d.amount), n(d.paid), n(d.amount - d.paid), cu(d.cur), d.closed ? 'Yopilgan' : 'Ochiq', d.note].map(q).join(';')));
  const blob = new Blob(['﻿' + L.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hisobchi-' + todayK() + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  toast('Fayl yuklab olindi');
}

/* ---------- kirish (Telegram'dan tashqarida) ---------- */
let pollT = 0;
function renderLogin(msg) {
  $('#bnav').classList.add('hidden'); $('#topbar').classList.add('hidden'); $('#sidebar').classList.add('hidden');
  $('#main').innerHTML = '<div class="center-screen"><div style="width:100%;max-width:400px;display:flex;flex-direction:column;gap:1.25rem">' +
    '<div class="row"><div class="logo" style="width:48px;height:48px;font-size:1.375rem;border-radius:14px">H</div><div><div class="fw7" style="font-size:1.5rem;letter-spacing:-.01em">Hisobchi</div><div class="muted">Kirim · chiqim · qarz oldi-berdi</div></div></div>' +
    '<div class="card p4" style="display:flex;flex-direction:column;gap:.75rem;padding:1.25rem">' +
      '<button id="lg-btn" class="btn btn-primary" style="min-height:52px;font-size:1rem">' + ic('send') + 'Telegram orqali kirish</button>' +
      '<div id="lg-msg" class="fs14 muted" style="text-align:center;line-height:1.5">' + (msg || 'Parol kerak emas. Botda «✅ Ha, kirish»ni bosasiz — ilova oʻzi ochiladi. <b>Bepul</b>.') + '</div></div>' +
    '<a href="../ilovalar/" class="btn btn-text" style="align-self:center">' + ic('grid', 18) + 'Boshqa ilovalar</a></div></div>';
  $('#lg-btn').onclick = startLogin;
}
async function startLogin() {
  const btn = $('#lg-btn'), m = $('#lg-msg'); btn.disabled = true;
  try {
    const r = await api('login_start');
    if (!r.bot) throw { code: 'NO_BOT' };
    const url = 'https://t.me/' + r.bot + '?start=hb_' + r.code;
    m.innerHTML = '<div class="spin" style="margin:0 auto .5rem"></div>Telegram ochildi — botda <b>«✅ Ha, kirish»</b>ni bosing va shu yerga qayting.<br><a class="c-pri fw6" href="' + url + '" target="_blank" rel="noopener">Telegram ochilmadimi? Shu yerni bosing</a>';
    window.open(url, '_blank');
    const until = Date.now() + 15 * 60e3;
    clearInterval(pollT);
    pollT = setInterval(async () => {
      if (Date.now() > until) { clearInterval(pollT); renderLogin('⌛️ Vaqt tugadi — qayta bosing.'); return; }
      try { const p = await api('login_poll', { code: r.code }); if (p.token) { clearInterval(pollT); S.auth = p.token; try { localStorage.setItem(TOKEN_KEY, p.token); } catch (e) { /* ignore */ } boot(); } }
      catch (e) { if (e.code === 'EXPIRED') { clearInterval(pollT); renderLogin('⌛️ Havola muddati oʻtdi — qayta bosing.'); } }
    }, 2000);
  } catch (e) { btn.disabled = false; m.textContent = errText(e); }
}
function logout(expired) { try { localStorage.removeItem(TOKEN_KEY); } catch (e) { /* ignore */ } S.auth = null; S.data = null; renderLogin(expired ? 'Kirish muddati tugagan — qayta kiring.' : ''); }
function renderFatal(msg) {
  $('#main').innerHTML = '<div class="center-screen"><div class="card p4" style="max-width:380px;text-align:center;display:flex;flex-direction:column;gap:.75rem;padding:1.5rem"><div class="fw7" style="font-size:1.125rem">Yuklab boʻlmadi</div><div class="muted">' + esc(msg) + '</div><button class="btn btn-primary" id="retry">' + ic('sync', 18) + 'Qayta urinish</button></div></div>';
  $('#retry').onclick = () => { $('#main').innerHTML = '<div class="center-screen"><div class="spin"></div></div>'; load(); };
}

/* ---------- ishga tushirish ---------- */
function boot() {
  $('#bnav').classList.remove('hidden'); $('#topbar').classList.remove('hidden'); $('#sidebar').classList.remove('hidden');
  $('#main').innerHTML = '<div class="center-screen"><div class="spin"></div></div>';
  renderNav();
  load(false, true);
}
$('#m-refresh').innerHTML = ic('sync');
$('#m-refresh').onclick = () => { if (S.data) { load(true).then(() => toast('Yangilandi')); } };
$('#m-theme').onclick = () => { const dark = document.documentElement.classList.contains('dark'); applyTheme(dark ? 'light' : 'dark'); };
$('#sb-apps').innerHTML = ic('grid', 16) + '<span>Ilovalar</span>';
$('#sb-apps').href = '../ilovalar/' + (location.hash || '');
applyTheme(getTheme());
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (getTheme() === 'system') applyTheme('system'); }); } catch (e) { /* ignore */ }
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.data && Date.now() - (S.data.now || 0) > 60e3) load(true); });
try { S.auth = localStorage.getItem(TOKEN_KEY) || null; } catch (e) { /* ignore */ }
if (TG_INIT || S.auth) boot(); else renderLogin();
})();
</script>
