<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360">
<title>Telegram (namuna)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; background: #fff; overflow: hidden; }
  #hd { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #fff; border-bottom: 1px solid #e5e7eb; flex-shrink: 0; }
  #hd .bk { color: #3390ec; font-size: 22px; line-height: 1; }
  #hd .av { width: 38px; height: 38px; border-radius: 50%; background: #1f4fd6; color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px; }
  #hd .n { font-weight: 700; font-size: 15px; color: #0f172a; } #hd .s { font-size: 12px; color: #8a96a3; }
  #msgs { flex: 1; overflow-y: auto; padding: 10px 10px 6px; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth;
    background-color: #c7dfb4; background-image: radial-gradient(circle at 20% 30%, rgb(255 255 255 / .25) 0 2px, transparent 3px), radial-gradient(circle at 70% 80%, rgb(255 255 255 / .2) 0 2px, transparent 3px); background-size: 46px 46px, 64px 64px; }
  #msgs::-webkit-scrollbar { display: none; }
  .m { max-width: 84%; padding: 7px 10px 5px; border-radius: 14px; font-size: 13.5px; line-height: 1.36; color: #0f172a; position: relative; animation: in .25s ease-out; word-wrap: break-word; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .m.b { background: #fff; align-self: flex-start; border-bottom-left-radius: 4px; }
  .m.u { background: #e3fdd0; align-self: flex-end; border-bottom-right-radius: 4px; }
  .m .tm { float: right; font-size: 10.5px; color: #8a96a3; margin: 6px 0 0 8px; }
  .m.u .tm { color: #5fa94a; }
  .m b { font-weight: 700; } .m i { color: #475569; } .m code { font-family: ui-monospace, monospace; background: #f1f5f9; padding: 0 3px; border-radius: 4px; font-size: 12.5px; }
  .m a { color: #2481cc; }
  .ik { align-self: flex-start; max-width: 84%; width: 84%; display: flex; flex-direction: column; gap: 4px; margin-top: -2px; animation: in .25s ease-out; }
  .ik .r { display: flex; gap: 4px; }
  .ik button { flex: 1; min-height: 34px; border: 0; border-radius: 10px; background: rgb(74 113 82 / .38); color: #fff; font: 600 12.5px Inter, system-ui, sans-serif; padding: 4px 6px; text-shadow: 0 1px 1px rgb(0 0 0 / .15); }
  .ct { display: flex; align-items: center; gap: 10px; }
  .ct .ci { width: 38px; height: 38px; border-radius: 50%; background: #3390ec; color: #fff; display: grid; place-items: center; font-size: 18px; }
  #kb { background: #f1f3f6; padding: 6px; display: none; flex-direction: column; gap: 6px; flex-shrink: 0; }
  #kb.on { display: flex; }
  #kb .r { display: flex; gap: 6px; }
  #kb button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: #fff; box-shadow: 0 1px 1px rgb(0 0 0 / .12); color: #0f172a; font: 600 12.5px Inter, system-ui, sans-serif; padding: 2px 4px; }
  #bar { display: flex; align-items: center; gap: 8px; padding: 7px 8px; background: #fff; border-top: 1px solid #e5e7eb; flex-shrink: 0; }
  #menu { display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 12px; border: 0; border-radius: 17px; background: #3390ec; color: #fff; font: 700 13px Inter, system-ui, sans-serif; }
  #menu.hidden { display: none; }
  #inp { flex: 1; min-height: 34px; display: flex; align-items: center; font-size: 14px; color: #0f172a; overflow: hidden; white-space: nowrap; }
  #inp.ph { color: #9aa4af; }
  #inp .cr { display: inline-block; width: 1.5px; height: 17px; background: #3390ec; margin-left: 1px; animation: bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity: 0; } }
  #snd { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #3390ec; }
</style>
</head>
<body>
<div id="hd"><span class="bk">‹</span><div class="av">M</div><div style="flex:1"><div class="n">Minimarket POS</div><div class="s">bot</div></div><span style="color:#8a96a3;font-size:18px">⋮</span></div>
<div id="msgs"></div>
<div id="kb"></div>
<div id="bar"><button id="menu" class="hidden"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Ilovalar</button>
  <div id="inp" class="ph">Xabar</div>
  <span id="snd"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span></div>
<script>
const $ = (s) => document.querySelector(s);
let clock = 9 * 60 + 41;
const tm = () => { const h = Math.floor(clock / 60), m = clock % 60; return h + ':' + String(m).padStart(2, '0'); };
const down = () => { const m = $('#msgs'); m.scrollTop = m.scrollHeight; };
window.TG = {
  title(name, sub) { document.querySelector('#hd .n').textContent = name; document.querySelector('#hd .s').textContent = sub || 'bot'; },
  menu(on) { $('#menu').classList.toggle('hidden', !on); },
  bot(html, rows) {
    const d = document.createElement('div'); d.className = 'm b'; d.innerHTML = html + '<span class="tm">' + tm() + '</span>'; $('#msgs').appendChild(d);
    if (rows) { const k = document.createElement('div'); k.className = 'ik'; k.innerHTML = rows.map((r) => '<div class="r">' + r.map((b) => '<button data-b="' + (b[1] || b[0]) + '">' + b[0] + '</button>').join('') + '</div>').join(''); $('#msgs').appendChild(k); }
    down(); return d;
  },
  me(html) { const d = document.createElement('div'); d.className = 'm u'; d.innerHTML = html + '<span class="tm">' + tm() + ' ✓✓</span>'; $('#msgs').appendChild(d); down(); return d; },
  contact(name, phone) { return TG.me('<div class="ct"><span class="ci">👤</span><div><b>' + name + '</b><div style="font-size:12px;color:#4b7a3a">' + phone + '</div></div></div>'); },
  kb(rows) { const k = $('#kb'); if (!rows) { k.classList.remove('on'); k.innerHTML = ''; return; } k.innerHTML = rows.map((r) => '<div class="r">' + r.map((b) => '<button data-k="' + b + '">' + b + '</button>').join('') + '</div>').join(''); k.classList.add('on'); down(); },
  inp(text) { const i = $('#inp'); if (text == null || text === '') { i.className = 'ph'; i.textContent = 'Xabar'; return; } i.className = ''; i.innerHTML = text.replace(/</g, '&lt;') + '<span class="cr"></span>'; },
  editLast(html, rows) {
    const ms = [...document.querySelectorAll('.m.b')], d = ms[ms.length - 1]; if (!d) return;
    d.innerHTML = html + '<span class="tm">' + tm() + '</span>';
    const k = d.nextElementSibling; if (k && k.classList.contains('ik')) k.remove();
    if (rows) { const n = document.createElement('div'); n.className = 'ik'; n.innerHTML = rows.map((r) => '<div class="r">' + r.map((b) => '<button data-b="' + (b[1] || b[0]) + '">' + b[0] + '</button>').join('') + '</div>').join(''); d.after(n); }
    down();
  },
  clear() { $('#msgs').innerHTML = ''; },
  tick(n) { clock += n || 1; },
};
</script>
</body>
</html>
