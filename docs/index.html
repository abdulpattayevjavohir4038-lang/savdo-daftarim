            if (d0 > 0) db.ledger.push({ id: uid('l'), ts: Date.now(), type, partyId: pid, kind: 'debt', amount: d0, note: 'Eski qarz' });
          }
          save(); closeModal(); toast('Saqlandi: ' + name);
          if (onSaved) onSaved(pid); else render();
        });
      }
    });
}

function lastActivity(type, id) {
  let t = 0;
  for (const l of db.ledger) if (l.type === type && l.partyId === id && l.ts > t) t = l.ts;
  return t;
}
function drawParties() {
  const type = S.qtype;
  let list = searchList(type === 'customer' ? db.customers : db.suppliers, S.qq, (x) => x.name, (x) => (x.phone || '').replace(/\D/g, ''))
    .map((x) => ({ x, st: partyStats(type, x.id) }));
  if (S.qf === 'open') list = list.filter((r) => r.st.bal > 0);
  if (S.qf === 'closed') list = list.filter((r) => r.st.bal <= 0 && r.st.n > 0);

  const isPay = l.kind === 'payment';
  openModal(isPay ? 'Toʻlovni tahrirlash' : 'Qarz yozuvini tahrirlash',
    '<p class="text-sm text-muted mb-3">' + esc(ledgerDesc(l)) + '</p>' +

    (isPay ? '<div><label class="label" for="le-m">Toʻlov turi</label><select id="le-m" class="input">' + opt('naqd', 'Naqd', l.method !== 'karta') + opt('karta', 'Plastik karta', l.method === 'karta') + '</select></div>' : '') +

    '<div><label class="label" for="le-n">Izoh</label><input id="le-n" class="input" value="' + esc(l.note || '') + '"></div></div>',
    '<button id="le-back" class="btn btn-ghost">' + ic('left', 'w-4 h-4') + 'Orqaga</button><button id="le-ok" class="btn btn-primary">' + ic('check') + 'Saqlash</button>',
    {
      onMount: () => {
        $('#le-back').onclick = () => historyModal(type, id);
        $('#le-a').select();
        once($('#le-ok'), () => {
          let a = rm(num($('#le-a').value));
          if (a <= 0 && !sale) { toast('Summa 0 boʻlsa, yozuvni oʻchiring', 'warn'); return; }

            a = Math.max(0, Math.min(a, sale.total - (sale.card || 0)));

          if (d !== dayKey(l.ts)) l.ts = tsFromDay(d);
          l.note = $('#le-n').value.trim() || l.note;
          if ($('#le-m')) l.method = $('#le-m').value;
          l.edited = Date.now();
          if (sale && a === 0) db.ledger = db.ledger.filter((x) => x.id !== l.id);
          toast('Saqlandi');
          afterLedgerChange(type, id);
        });
      }
    });
}

/* ---------- grafiklar (bitta seriya — bitta rang, tagida yorliq; sichqoncha/barmoq bilan qiymat) ---------- */
// items: [{ label, value, tip }]; o: { color: css-var nomi yoki fn(v), fmt, h, unit }
function vbars(el, items, o = {}) {
  if (!el) return;
  const draw = () => {
    const W = Math.max(260, el.clientWidth || 600), H = o.h || (W < 480 ? 180 : 210);
    const padL = 44, padR = 6, padT = 10, padB = 24, fmtv = o.fmt || compact;
    const vals = items.map((x) => x.value);
    let max = Math.max(0, ...vals), min = Math.min(0, ...vals); if (max === min) max = min + 1;
    const ticks = niceTicks(min, max, 4), lo = ticks[0], hi = ticks[ticks.length - 1];
    const y = (v) => padT + (hi - v) / (hi - lo || 1) * (H - padT - padB);
    const n = items.length, cw = (W - padL - padR) / Math.max(1, n), bw = Math.max(3, Math.min(22, cw * 0.6));
    const step = Math.ceil(n / Math.max(2, Math.floor((W - padL) / 34)));
    const col = (v) => 'rgb(var(' + (typeof o.color === 'function' ? o.color(v) : o.color || '--primary') + '))';
    let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Grafik') + '">';
    for (const t of ticks) s += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(t) + '" y2="' + y(t) + '" style="stroke:rgb(var(' + (t === 0 ? '--line-strong' : '--line') + '))" stroke-width="1"' + (t === 0 ? '' : ' stroke-dasharray="3 4"') + '/><text x="' + (padL - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" font-size="11" style="fill:rgb(var(--faint))">' + esc(fmtv(t)) + '</text>';
    items.forEach((x, i) => {
      const cx = padL + i * cw + cw / 2;
      s += '<rect class="hv" x="' + (padL + i * cw) + '" y="' + padT + '" width="' + cw + '" height="' + (H - padT - padB) + '" rx="6" style="fill:rgb(var(--subtle));opacity:0"/>';
      if (x.value) { const top = Math.min(y(x.value), y(0)), hh = Math.max(1, Math.abs(y(x.value) - y(0))); s += '<rect x="' + (cx - bw / 2) + '" y="' + top + '" width="' + bw + '" height="' + hh + '" rx="' + Math.min(4, bw / 2) + '" style="fill:' + col(x.value) + '"/>'; }
      if (i % step === 0) s += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" style="fill:rgb(var(--faint))">' + esc(x.label) + '</text>';
    });
    s += '</svg>';
    el.innerHTML = s + (items.some((x) => x.value) ? '' : '<div class="absolute inset-0 grid place-items-center text-sm text-faint pointer-events-none">Maʼlumot yoʻq</div>') + '<div class="tip hidden"></div>';
    const tip = $('.tip', el), svg = $('svg', el), hvs = $$('.hv', el);
    const show = (ev) => {
      const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor(((ev.clientX - r.left) / r.width * W - padL) / cw))), x = items[i];
      hvs.forEach((h, k) => { h.style.opacity = k === i ? '1' : '0'; });
      tip.innerHTML = '<div class="font-semibold mb-0.5">' + esc(x.tip || x.label) + '</div><div class="num">' + (o.money === false ? fq(x.value) + (o.unit ? ' ' + o.unit : '') : money(x.value)) + '</div>' + (x.sub ? '<div style="opacity:.8">' + x.sub + '</div>' : '');
      tip.classList.remove('hidden'); const tw = tip.offsetWidth; tip.style.left = Math.max(tw / 2, Math.min(W - tw / 2, padL + i * cw + cw / 2)) + 'px';
    };
    svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', () => { tip.classList.add('hidden'); hvs.forEach((h) => { h.style.opacity = '0'; }); });
  };
  CHARTS.push({ el, w: el.clientWidth, draw });
  draw();
}
// gorizontal ustunlar (nom + qiymat + ulush) — HTML
function hbarsHtml(rows, o = {}) {
  if (!rows.length) return '<div class="text-sm text-faint py-4 text-center">' + (o.empty || 'Maʼlumot yoʻq') + '</div>';
  const mx = Math.max(1, ...rows.map((r) => Math.abs(r[1]))), tot = o.total || rows.reduce((a, r) => a + r[1], 0);
  return '<div class="space-y-3">' + rows.map(([l, v, sub]) => '<div><div class="flex justify-between gap-3 text-sm mb-1"><span class="text-muted truncate">' + esc(l) + '</span>' +
    '<span class="num font-semibold text-ink whitespace-nowrap">' + (o.money === false ? fq(v) : money(v)) + (o.pct !== false && tot ? ' <span class="text-faint font-medium">· ' + pctTxt(v, tot) + '</span>' : '') + (sub ? ' <span class="text-faint font-medium">· ' + sub + '</span>' : '') + '</span></div>' +
    '<div class="bar"><i style="width:' + Math.max(2, Math.round(Math.abs(v) / mx * 100)) + '%;background:rgb(var(' + (o.color || '--primary') + '))"></i></div></div>').join('') + '</div>';
}
const acard = (title, body, right) => '<section class="card min-w-0"><div class="card-h"><h2 class="sect-t">' + title + '</h2>' + (right || '') + '</div><div class="p-4">' + body + '</div></section>';

  const spay = db.ledger.filter((l) => dayKey(l.ts) === k && l.type === 'supplier' && l.kind === 'payment' && !l.adjust);
  return { r, ops, cpay, spay };
}

/* ---------- Savdo analitikasi ---------- */
function drawSalesAn(el) {
  const days = S.anDays || 30, from = addDays(today(), -(days - 1)), b = { from, to: today() }, r = report(b);
  const daily = [], byWd = Array(7).fill(0), wdN = Array(7).fill(0), hours = Array(24).fill(0);
  for (let k = from; k <= today(); k = addDays(k, 1)) { const x = report({ from: k, to: k }); daily.push({ k, rev: x.oborot, gp: x.gross }); byWd[wdIdx(k)] += x.oborot; wdN[wdIdx(k)]++; }
  for (const s of r.sales) hours[new Date(s.ts).getHours()]++;
  const cat = {};
  for (const k in r.byProd) { const row = r.byProd[k], p = prod(k); const c = (p && p.category) || 'Boshqa'; cat[c] = (cat[c] || 0) + row.sum; }

}

/* ---------- Prognoz: necha kunga yetadi, qancha olish kerak ---------- */
function forecastRows(cover) {
  const from = addDays(today(), -29), sold = {}, lastSup = {};
  for (const s of db.sales) if (dayKey(s.ts) >= from) for (const it of s.items) sold[it.pid] = (sold[it.pid] || 0) + it.qty;
  for (const r of db.returns) if (dayKey(r.ts) >= from) for (const it of r.items) sold[it.pid] = (sold[it.pid] || 0) - it.qty;
  for (const m of db.moves.slice().sort((a, b) => a.ts - b.ts)) if (m.type === 'prixod' && m.supplierId) lastSup[m.pid] = m.supplierId;
  const first = firstActivityTs(), span = Math.max(1, Math.min(30, first ? Math.ceil((Date.now() - first) / 864e5) : 30));
  return db.products.map((p) => {
    const avg = Math.max(0, (sold[p.id] || 0) / span), stock = Math.max(0, p.stock);
    const left = avg > 0 ? stock / avg : Infinity, need = avg > 0 ? Math.max(0, Math.ceil(avg * cover - p.stock)) : 0;
    return { p, avg, left, need: isWeightUnit(p.unit) ? rq(Math.max(0, avg * cover - p.stock)) : need, sup: lastSup[p.id] || '' };
  }).filter((x) => x.avg > 0).sort((a, b) => a.left - b.left);
}
function drawForecast(el) {

    '<div class="grid grid-cols-2 xl:grid-cols-3 gap-3 mt-3">' +
    kpi('Buyurtma kerak', String(order.length), { raw: true, icon: 'inbox', itone: order.length ? 't-warn' : 't-muted', sub: cover + ' kunga yetishi uchun' }) +

    kpi('3 kun ichida tugaydi', String(rows.filter((x) => Math.floor(x.left) <= 3).length), { raw: true, icon: 'alert', itone: 't-neg' }) + '</div>' +
    '<section class="card mt-3"><div class="card-h flex-wrap"><h2 class="sect-t">Buyurtma roʻyxati</h2><div class="flex gap-2"><button id="fc-print" class="btn btn-ghost btn-sm"' + (order.length ? '' : ' disabled') + '>' + (NATIVE ? ic('receipt', 'w-4 h-4') + 'Yuborish' : ic('print', 'w-4 h-4') + 'Chop etish') + '</button>' +

  $$('[data-cv]', el).forEach((x) => x.onclick = () => { S.cover = +x.dataset.cv; render(); });

/* ---------- Kassa amallari: smenalar (Z), pul qo'shish/olish ---------- */
function devLabel(dev) { if (dev === DEV) return 'Shu kassa'; const devs = Array.from(new Set(db.shifts.map((s) => s.dev).filter((d) => d !== DEV))).sort(); return 'Kassa ' + (devs.indexOf(dev) + 2); }
function drawerTotal() {
  let t = 0;
  for (const d of new Set(db.shifts.map((s) => s.dev))) {
    let open = null, last = null;
    for (const s of db.shifts) if (s.dev === d) { if (!s.closeTs) { if (!open || s.openTs > open.openTs) open = s; } else if (!last || s.closeTs > last.closeTs) last = s; }
    if (open) t += shiftFlow(open).expected; else if (last) t += Math.max(0, last.left != null ? last.left : last.counted || 0);
  }
  return rm(t);
}

/* ---------- Shubhali amallar ---------- */
function suspiciousList(b) {
  const thr = +db.settings.suspPct || 10, out = [];
  for (const s of db.sales) if (inRange(s.ts, b)) {
    if (s.subtotal && s.discount / s.subtotal * 100 >= thr) out.push({ ts: s.ts, k: 'disc', t: 'Katta chegirma', d: 'Chek №' + s.no + ' · ' + Math.round(s.discount / s.subtotal * 100) + '% (' + money(s.discount) + ')', v: s.discount, id: s.id });
    if (s.manual) { const low = s.items.filter((it) => { const p = prod(it.pid); return p && it.price < p.price; }); if (low.length) out.push({ ts: s.ts, k: 'price', t: 'Narx kassada tushirilgan', d: 'Chek №' + s.no + ': ' + low.map((it) => it.name + ' ' + fmt(it.price)).join(', '), v: 0, id: s.id }); }
  }
  for (const r of db.returns) if (inRange(r.ts, b)) out.push({ ts: r.ts, k: 'ret', t: 'Qaytarish', d: 'Chek №' + r.saleNo + ' · ' + (r.reason || '') + ' · ' + r.items.map((i) => i.name).join(', '), v: r.total });
  for (const a of db.audit || []) if (a.kind === 'cancel' && inRange(a.ts, b)) out.push({ ts: a.ts, k: 'cancel', t: 'Chek bekor qilindi', d: 'Chek №' + a.saleNo + ' · ' + (a.items || ''), v: a.total });
  for (const s of db.shifts) if (s.closeTs && s.diff < 0 && inRange(s.closeTs, b)) out.push({ ts: s.closeTs, k: 'short', t: 'Kassa kamomadi', d: devLabel(s.dev) + ' · Z-hisobot', v: -s.diff });
  return out.sort((a, c) => c.ts - a.ts);
}

async function aiImageB64(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({ code: 'BAD_IMAGE' }); i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85).split(',')[1];
  } finally { URL.revokeObjectURL(url); }
}
// Nakladnoydagi nomni bazadagi tovarga moslash (topilmasa — yangi tovar)
function aiMatchProduct(it) {
  const bc = String(it.barcode || '').replace(/\D/g, '');
  if (bc.length >= 6) { const p = findByCode(bc); if (p) return p; }
  const n = String(it.name || '').trim();
  if (!n) return null;
  const nw = skel(n).split(' ').filter((w) => w.length > 1);
  let best = null, bs = 0;
  for (const p of db.products) {
    let s = matchScore(p.name, n);
    if (skel(p.name).replace(/ /g, '').length >= 6) s = Math.max(s, matchScore(n, p.name));
    if (s < 60 && nw.length) {
      const pw = skel(p.name).split(' ').filter((w) => w.length > 1), common = pw.filter((w) => nw.includes(w)).length;
      if (common >= 2 && common / Math.min(pw.length, nw.length) >= 0.75) s = 60;
    }
    if (s > bs) { bs = s; best = p; }
  }
  return bs >= 60 ? best : null;
}
function aiInvoiceLines(inv) {
  const out = [];
  for (const it of (inv && inv.items) || []) {
    let qty = rq(num(it.qty)), cost = rm(num(it.price));
    if (!cost && num(it.sum) && qty) cost = rm(num(it.sum) / qty);
    if (!(qty > 0) || !String(it.name || '').trim()) continue;
    const p = aiMatchProduct(it);
    if (p) out.push({ pid: p.id, qty, cost: cost || p.cost || '', price: '', exp: '', aiName: String(it.name).trim() });
    else out.push({ name: String(it.name).trim().slice(0, 80), barcode: String(it.barcode || '').replace(/\D/g, ''), unit: UNITS.includes(it.unit) ? it.unit : 'dona', qty, cost: cost || '', price: '', exp: '' });
  }
  return out;
}

let QR_LOAD = null;
function loadQr() {
  if (window.qrcode) return Promise.resolve(window.qrcode);
  if (!QR_LOAD) QR_LOAD = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';
    s.onload = () => (window.qrcode ? res(window.qrcode) : rej(new Error('qr')));
    s.onerror = () => { QR_LOAD = null; rej(new Error('qr')); };
    document.head.appendChild(s);
  });
  return QR_LOAD;
}

function tgLinkShow(bot, code, role, before) {
  const url = 'https://t.me/' + bot + '?start=' + code;
  openModal('Telegramni ulash — ' + TG_ROLE[role],
    '<ol class="text-sm text-muted list-decimal pl-5 space-y-1"><li>Telegram oʻrnatilgan telefonda quyidagi tugmani bosing (yoki QR kodni telefon kamerasi bilan skanerlang).</li><li>Botda <b>«Start»</b> (Boshlash) ni bosing — tayyor.</li></ol>' +

    '<div class="mt-4 grid place-items-center"><div id="tg-qr" class="w-48 h-48 rounded-xl bg-white p-2 grid place-items-center text-xs text-faint">QR kod…</div></div>' +

    '<div id="tg-wait" class="mt-3 rounded-xl bg-subtle px-3 py-2.5 text-sm text-muted text-center animate-pulse">Ulanishni kutyapmiz…</div>',

        $('#tg-share').onclick = () => {
          const text = 'Doʻkon hisobotlarini Telegramda olish uchun shu havolani oching va «Start»ni bosing: ' + url;
          if (NATIVE) nativeShareText('Telegram ulash', text);
          else if (navigator.share) navigator.share({ title: 'Telegram ulash', text }).catch(() => { /* bekor */ });
          else copyText(url, 'Havola nusxalandi');
        };
        loadQr().then((qr) => {
          const el = $('#tg-qr'); if (!el) return;
          const q = qr(0, 'M'); q.addData(url); q.make();
          el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
          const sv = el.querySelector('svg'); if (sv) { sv.setAttribute('class', 'w-full h-full'); sv.setAttribute('role', 'img'); sv.setAttribute('aria-label', 'Telegram ulash QR kodi'); }
        }).catch(() => { const el = $('#tg-qr'); if (el) el.innerHTML = '<span class="text-center px-2">QR kod uchun internet kerak — «Telegramda ochish» yoki «Havolani yuborish»dan foydalaning</span>'; });
        // ulanganini kutamiz (3 soniyada bir tekshiramiz, 30 daqiqagacha)
        const t0 = Date.now();
        const poll = async () => {
          if (!$('#tg-wait')) return;
          try {
            const st = await tgState(), list = st.chats || [];

              tgDraw(); return;
            }

          if (Date.now() - t0 < 30 * 60e3) setTimeout(poll, 3000);
          else { const w = $('#tg-wait'); if (w) { w.classList.remove('animate-pulse'); w.textContent = 'Havola muddati tugadi — qaytadan «Telegramni ulash»ni bosing.'; } }
        };
        setTimeout(poll, 3000);
      }
    });
}

  $('#st-save').onclick = () => { db.settings.shopName = $('#st-name').value.trim() || 'Minimarket'; save(); toast('Saqlandi'); };
  $('#b-reset').onclick = () => adminGate('reset', () => $('#b-reset').click()) && confirmBox('Barcha maʼlumotlarni oʻchirish', 'Mahsulotlar, sotuvlar, qarzlar va xarajatlar butunlay oʻchadi' + (CLOUD_CFG ? ' — <b class="text-ink">doʻkondagi barcha qurilmalarda va serverda</b>' : '') + '. Avval JSON nusxa olganingizga ishonch hosil qiling.', 'Ha, hammasini oʻchirish', () => {
    const keep = { theme: db.settings.theme, autoFull: db.settings.autoFull };
    db = emptyDB(); Object.assign(db.settings, keep); save(); clearAllCarts(); toast('Barcha maʼlumotlar oʻchirildi'); setTab('sozlama');
  });
}
function download(name, text, mime) {
  if (NATIVE) { nativeSaveFile(name, text, mime); return; }
  const blob = new Blob([text], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('Yuklab olindi: ' + name);
}
function csv(rows) {
  const cell = (v) => {
    let s = v == null ? '' : String(v);
    if (/^[=+\-@]/.test(s) && !/^-?\d+([.,]\d+)?$/.test(s)) s = "'" + s;
    return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return '﻿' + rows.map((r) => r.map(cell).join(';')).join('\r\n');
}
function exportSales() {
  const rows = [['Chek', 'Sana', 'Mahsulot', 'Miqdor', 'Birlik', 'Narx', 'Summa', 'Chegirma ulushi', 'Tannarx', "To'lov turi", 'Mijoz']];
  db.sales.slice().sort((a, b) => a.ts - b.ts).forEach((s) => {
    const c = s.customerId ? party('customer', s.customerId) : null;
    s.items.forEach((it) => rows.push([s.no, fdt(s.ts), it.name, String(it.qty).replace('.', ','), it.unit, it.price, it.sum, it.disc || 0, rm(it.qty * it.cost), PAY_LABEL[s.payType], c ? c.name : '']));
  });
  download('sotuvlar-' + today() + '.csv', csv(rows), 'text/csv');
}
function exportProducts() {
  const rows = [['Nomi', 'Shtrix-kod', 'Kategoriya', 'Birlik', 'Tannarx', 'Sotish narxi', 'Qoldiq', 'Minimal', 'Summa (tannarx)', 'Summa (sotish)']];
  db.products.forEach((p) => rows.push([p.name, p.barcode, p.category, p.unit, p.cost, p.price, String(p.stock).replace('.', ','), p.min, rm(Math.max(0, p.stock) * p.cost), rm(Math.max(0, p.stock) * p.price)]));
  download('mahsulotlar-' + today() + '.csv', csv(rows), 'text/csv');
}
function exportExpenses() {
  const rows = [['Sana', 'Turi', 'Summa', 'Izoh', "To'lov turi"]];
  db.expenses.slice().sort((a, b) => a.ts - b.ts).forEach((e) => rows.push([fdt(e.ts), e.category, e.amount, e.note, e.method ? METHOD_LABEL[e.method] || e.method : '']));
  db.moves.filter((m) => m.type === 'spisaniya').forEach((m) => rows.push([fdt(m.ts), 'Spisaniya: ' + m.name, m.total, m.reason, '']));
  download('xarajatlar-' + today() + '.csv', csv(rows), 'text/csv');
}
function importJson(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!data || !Array.isArray(data.products) || !Array.isArray(data.sales)) throw new Error('format');
      confirmBox('Nusxadan tiklash', 'Hozirgi maʼlumotlar oʻrniga fayldagi maʼlumotlar yoziladi (' + data.products.length + ' mahsulot, ' + data.sales.length + ' sotuv). Davom etilsinmi?', 'Tiklash', () => {
        db = normalize(data); save(); applyTheme(); resetCart(); toast('Maʼlumotlar tiklandi'); setTab('sozlama');
      }, false);
    } catch (err) { toast('Fayl notoʻgʻri: bu ilovaning JSON nusxasi emas', 'err'); }
  };
  rd.readAsText(f);
  e.target.value = '';
}

/* ===================== TO'LIQ EKRAN (TIK HOLAT) ===================== */
function orientAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  return typeof window.orientation === 'number' ? window.orientation : 0;
}
const isPhone = () => (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) && Math.min(screen.width, screen.height) < 600;
// Telefonning o'zi yotqizilganmi? (oyna o'lchamiga emas, qurilma holatiga qaraymiz: ko'rish oynasi, klaviatura
// yoki ekranni bo'lish rejimida oyna "keng" bo'lib qolsa ham ilova burilmasligi kerak)
function deviceLandscape() {
  const o = screen.orientation;
  if (o && typeof o.type === 'string' && o.type) return o.type.indexOf('landscape') === 0;
  if (typeof window.orientation === 'number') return Math.abs(window.orientation) === 90;
  return screen.width > screen.height;
}
function applyRotation() {
  const h = document.documentElement, w = window.innerWidth, ht = window.innerHeight;
  const land = isPhone() && deviceLandscape() && w > ht;
  h.style.setProperty('--vw', w + 'px');
  h.style.setProperty('--vh', ht + 'px');
  h.classList.toggle('land', land);
  const a = orientAngle();
  // 90 = telefon chapga burilgan (-90° burib qaytaramiz), 270/-90 = o'ngga burilgan (+90°)
  h.classList.toggle('rot-cw', land && (a === 270 || a === -90));
  if (isFull()) lockPortrait();
}
applyRotation();
lockPortrait();
if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', applyRotation);
window.addEventListener('orientationchange', applyRotation);
window.addEventListener('resize', applyRotation);
const isTouch = () => window.matchMedia('(pointer: coarse)').matches;
function isFull() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function lockPortrait() {
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {}); } catch (e) { /* qo'llab-quvvatlanmaydi */ }
}
function enterFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) { toast('Bu brauzer toʻliq ekranni qoʻllamaydi. iPhoneʼda: Ulashish → «Bosh ekranga qoʻshish»', 'warn'); return; }
  try {
    const r = req.call(el, { navigationUI: 'hide' });
    if (r && r.then) r.then(lockPortrait).catch(() => {}); else lockPortrait();
  } catch (e) { /* ignore */ }
}
function exitFullscreen() {
  const ex = document.exitFullscreen || document.webkitExitFullscreen;
  if (ex) try { ex.call(document); } catch (e) { /* ignore */ }
}
function updateFsLabel() { $$('[data-fs-label]').forEach((x) => x.textContent = isFull() ? 'Toʻliq ekrandan chiqish' : 'Toʻliq ekran'); }
document.addEventListener('click', (e) => { if (e.target.closest('[data-fs]')) { isFull() ? exitFullscreen() : enterFullscreen(); } });
document.addEventListener('fullscreenchange', updateFsLabel);
document.addEventListener('webkitfullscreenchange', updateFsLabel);
// Telefonda birinchi bosishda avtomatik to'liq ekran + tik holat (brauzer faqat bosishdan keyin ruxsat beradi)
let autoFsDone = false;
document.addEventListener('pointerup', (e) => {
  if (NATIVE || autoFsDone || !isTouch() || db.settings.autoFull === false || isFull()) return;
  if (e.target.closest('[data-fs]')) return;
  autoFsDone = true;
  enterFullscreen();
}, true);
// Web-ilova manifesti: «Bosh ekranga qo'shish»da tik holatda, to'liq ekranda ochiladi
if (!document.querySelector('link[rel="manifest"]')) try {
  const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><rect width="96" height="96" rx="20" fill="#1f4fd6"/><text x="48" y="64" font-size="52" text-anchor="middle" fill="#fff" font-family="Arial" font-weight="bold">M</text></svg>');
  const mf = { name: 'Minimarket POS', short_name: 'Minimarket', display: 'fullscreen', orientation: 'portrait', background_color: '#f4f6fa', theme_color: '#1f4fd6', start_url: location.href, icons: [{ src: icon, sizes: '96x96 192x192 512x512', type: 'image/svg+xml' }] };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
  document.head.appendChild(link);
} catch (e) { /* ignore */ }

}

tickClock();
updateBadges();
if (NATIVE) nativeBackButton();
if (CLOUD_CFG) cloudBoot(); else setTab('bosh');
})();
