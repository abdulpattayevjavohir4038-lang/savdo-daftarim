name: APK yigʻish

on:
  push:
    branches: [main]
    paths: ['docs/index.html', 'app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Paketlarni oʻrnatish
        working-directory: app
        run: npm ci

      - name: Veb-ilovani Android loyihasiga koʻchirish
        working-directory: app
        run: npm run sync

      - name: Imzo kaliti (agar sozlangan boʻlsa)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK yigʻish
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/minimarket-pos.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: minimarket-pos-apk
          path: minimarket-pos.apk

      - name: Reliz (doimiy yuklab olish havolasi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" minimarket-pos.apk \
            --title "Minimarket POS $TAG" \
            --notes "Android ilova. Telefonda faylni yuklab oling va oching (birinchi marta «Nomaʼlum manbalardan oʻrnatish»ga ruxsat bering)." \
            --latest
