name: APK yigʻish

on:
  push:
    branches: [main]
    paths: ['docs/index.html', 'app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # imzo kalitini serverdan olish uchun (GitHub OIDC)

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Paketlarni oʻrnatish
        working-directory: app
        run: npm ci

      - name: Veb-ilovani Android loyihasiga koʻchirish
        working-directory: app
        run: npm run sync

      # Har bir APK bitta doimiy kalit bilan imzolanadi — telefon yangi versiyani «yangilanish» deb qabul qiladi.
      # Kalit: GitHub secrets'da bo'lsa o'shandan, bo'lmasa serverdan (faqat shu repozitoriyning main shoxiga beriladi).
      - name: Imzo kaliti
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEYPW: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            PW="$KS_PW"; KA="$KS_ALIAS"; KP="$KS_KEYPW"
          else
            OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=savdo-daftarim-apk" | jq -r .value)
            RES=$(curl -sS -X POST "https://fgwqodeqfqbagimauulc.supabase.co/functions/v1/apk-key" \
              -H "apikey: sb_publishable_sYxQqC2eOvkeiX39MCNVxQ_epqjABBR" -H "x-github-oidc: $OIDC")
            PW=$(echo "$RES" | jq -r '.storePassword // empty'); KP=$(echo "$RES" | jq -r '.keyPassword // empty'); KA=$(echo "$RES" | jq -r '.keyAlias // empty')
            if [ -z "$PW" ]; then echo "::error::Imzo kaliti olinmadi: $(echo "$RES" | jq -r '.error // "nomaʼlum"')"; exit 1; fi
            echo "::add-mask::$PW"; echo "::add-mask::$KP"
            echo "$RES" | jq -r .keystore | base64 -d > "$RUNNER_TEMP/release.jks"
          fi
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PASSWORD=$PW"
            echo "KEY_PASSWORD=$KP"
            echo "KEY_ALIAS=$KA"
          } >> "$GITHUB_ENV"

      - name: APK yigʻish
        working-directory: app/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/minimarket-pos.apk"

      - name: Imzoni tekshirish
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$AS" verify --print-certs minimarket-pos.apk | tee signers.txt
          if grep -q "Android Debug" signers.txt; then echo "::error::APK vaqtinchalik (debug) kalit bilan imzolangan"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: minimarket-pos-apk
          path: minimarket-pos.apk

      - name: Reliz (doimiy yuklab olish havolasi)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" minimarket-pos.apk \
            --title "Minimarket POS $TAG" \
            --notes "Android ilova. Telefonda faylni yuklab oling va oching (birinchi marta «Nomaʼlum manbalardan oʻrnatish»ga ruxsat bering)." \
            --latest
