name: Video ovozi (TTS)

# Video darsliklar uchun oʻzbekcha ovoz: tools/tts/<nom>.json -> har qator uchun mp3 (artifact)
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'tools/tts ichidagi fayl nomi (masalan dars3)'
        required: true
      voice:
        description: 'Ovoz'
        default: 'uz-UZ-MadinaNeural'
      rate:
        description: 'Tezlik'
        default: '+0%'

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.3.1
      - name: Ovoz yaratish
        env:
          SCRIPT: ${{ inputs.script }}
          VOICE: ${{ inputs.voice }}
          RATE: ${{ inputs.rate }}
        run: |
          mkdir -p out
          python - <<'PY'
          import asyncio, json, os, sys, traceback, edge_tts
          items = json.load(open('tools/tts/' + os.environ['SCRIPT'] + '.json', encoding='utf-8'))
          async def main():
              for it in items:
                  txt = it['text'].replace('ʻ', "'").replace('ʼ', "'")
                  sub = edge_tts.SubMaker()
                  c = edge_tts.Communicate(txt, os.environ['VOICE'], rate=os.environ['RATE'])
                  with open('out/' + it['id'] + '.mp3', 'wb') as f:
                      async for ch in c.stream():
                          if ch['type'] == 'audio': f.write(ch['data'])
                          elif ch['type'] in ('WordBoundary', 'SentenceBoundary'): sub.feed(ch)
                  open('out/' + it['id'] + '.srt', 'w', encoding='utf-8').write(sub.get_srt())
                  print(it['id'], 'ok')
          try:
              asyncio.run(main())
          except Exception:
              open('out/error.txt', 'w').write(traceback.format_exc()); traceback.print_exc(); sys.exit(1)
          PY
      - name: Natijani alohida branchga yozish (tts/<nom>)
        if: always()
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          cd out
          git init -q -b main
          git config user.name tts-bot && git config user.email tts-bot@users.noreply.github.com
          git add -A && git commit -q -m "tts $SCRIPT"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/tts/$SCRIPT
